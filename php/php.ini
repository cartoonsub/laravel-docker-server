; Custom PHP settings for the Laravel container.
; Keep upload limits in sync with nginx `client_max_body_size` (4G).
; Movies are large: PHP streams uploads to a temp file on disk, so
; memory_limit does NOT need to match the file size.

upload_max_filesize = 4G
post_max_size = 4G
memory_limit = 512M

; Large uploads take time: do not kill the request mid-transfer.
max_execution_time = 3600
max_input_time = 3600

; Temp dir for uploads must have enough free disk space.
; Mounted from the host (./tmp/php) so multi-GB files never land in the
; container writable layer.
upload_tmp_dir = /var/tmp/php-uploads

; Opcache: production-friendly defaults
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
