user  nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Large movie uploads. Keep in sync with php.ini upload_max_filesize.
    # The body is streamed straight to PHP (fastcgi_request_buffering off),
    # so nginx does not need its own temp dir.
    client_max_body_size 4G;
    client_body_timeout 3600s;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # Server blocks are rendered from /etc/nginx/templates/*.template
    # by the container entrypoint (envsubst) at startup.
    include /etc/nginx/conf.d/*.conf;
}