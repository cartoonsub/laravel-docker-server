version: '3.8'

services:
  nginx:
    build:
      context: ./nginx
    container_name: nginx_container
    restart: unless-stopped
    environment:
      SERVER_NAME: ${SERVER_NAME}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${PROJECT_DIR}:/var/www/html
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/ssl:/etc/nginx/ssl
      - ./nginx/certbot/www:/var/www/certbot:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
    networks:
      - webnet

  certbot:
    image: certbot/certbot:latest
    container_name: certbot_container
    restart: unless-stopped
    environment:
      SERVER_NAME: ${SERVER_NAME}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL}
    # Copy the script to /tmp first so CRLF line endings (Windows checkout)
    # do not break execution of the read-only mounted file.
    entrypoint:
      - /bin/sh
      - -c
      - 'tr -d "\r" < /certbot-entrypoint.sh > /tmp/entrypoint.sh && exec sh /tmp/entrypoint.sh'
    volumes:
      - ./nginx/certbot-entrypoint.sh:/certbot-entrypoint.sh:ro
      - ./nginx/certbot/www:/var/www/certbot
      - ./nginx/certbot/conf:/etc/letsencrypt
    depends_on:
      - nginx
    networks:
      - webnet

  php:
    build:
      context: ./php
    container_name: php_server
    restart: unless-stopped
    volumes:
      - ${PROJECT_DIR}:/var/www/html
      - ./logs/php:/var/log/php
    networks:
      - webnet

  redis:
    image: redis:latest
    container_name: redis_container
    restart: unless-stopped
    ports:
      - "6379:6379"
    environment:
      - REDIS_PASSWORD=secret_redis
    command: ["redis-server", "--requirepass", "secret_redis"]
    networks:
      - webnet

  mariadb:
    image: mariadb:11.7.2
    container_name: mariadb_container
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Europe/Moscow
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - webnet
    command: >
      --character-set-server=utf8mb4 
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin_container
    restart: unless-stopped
    environment:
      PMA_HOST: mariadb_container
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      UPLOAD_LIMIT: 100000000
    ports:
      - "8080:80"
    networks:
      - webnet

networks:
  webnet:
    driver: bridge

volumes:
  mariadb_data:
    driver: local