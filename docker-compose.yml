services:
  nginx:
    build:
      context: ./nginx
    container_name: nginx_container
    restart: unless-stopped
    environment:
      SERVER_NAME: ${SERVER_NAME}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${PROJECT_DIR}:/var/www/html
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/ssl:/etc/nginx/ssl
      - ./nginx/certbot/www:/var/www/certbot:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
    # No depends_on php: nginx resolves the upstream lazily (resolver 127.0.0.11),
    # so a failed DB/PHP start cannot block ACME challenge and certificate renewal.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --no-check-certificate https://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: &default-logging
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - webnet

  certbot:
    image: certbot/certbot:latest
    container_name: certbot_container
    restart: unless-stopped
    environment:
      SERVER_NAME: ${SERVER_NAME}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL}
    # Copy the script to /tmp first so CRLF line endings (Windows checkout)
    # do not break execution of the read-only mounted file.
    entrypoint:
      - /bin/sh
      - -c
      - 'tr -d "\r" < /certbot-entrypoint.sh > /tmp/entrypoint.sh && exec sh /tmp/entrypoint.sh'
    volumes:
      - ./nginx/certbot-entrypoint.sh:/certbot-entrypoint.sh:ro
      - ./nginx/certbot/www:/var/www/certbot
      - ./nginx/certbot/conf:/etc/letsencrypt
    depends_on:
      - nginx
    logging: *default-logging
    networks:
      - webnet

  php:
    build:
      context: ./php
    image: laravel-docker-server/php:latest
    container_name: php_server
    restart: unless-stopped
    volumes:
      - ${PROJECT_DIR}:/var/www/html
      - ./logs/php:/var/log/php
      # PHP writes incoming uploads here before the app moves them.
      - ./tmp/php:/var/tmp/php-uploads
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\",9000)?0:1);'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging
    networks:
      - webnet

  # Laravel queue worker (php artisan queue:work)
  queue:
    # Reuses the image built by the php service (no second build).
    image: laravel-docker-server/php:latest
    container_name: queue_worker
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    environment:
      # Only the php service runs the scheduler
      RUN_CRON: "0"
    volumes:
      - ${PROJECT_DIR}:/var/www/html
      - ./logs/php:/var/log/php
    depends_on:
      php:
        condition: service_started
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Give the worker time to finish the current job on `docker stop`.
    stop_grace_period: 30s
    logging: *default-logging
    networks:
      - webnet

  redis:
    image: redis:latest
    container_name: redis_container
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging
    networks:
      - webnet

  mariadb:
    image: mariadb:11.7.2
    container_name: mariadb_container
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Europe/Moscow
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # NOTE: --default-authentication-plugin is a MySQL option, not MariaDB.
    # Passing it to MariaDB 11.x makes the server fail to start.
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    logging: *default-logging
    networks:
      - webnet

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin_container
    restart: unless-stopped
    environment:
      PMA_HOST: mariadb_container
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      UPLOAD_LIMIT: 100000000
    # Bound to localhost only: reach it via SSH tunnel, not from the internet.
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      mariadb:
        condition: service_healthy
    logging: *default-logging
    networks:
      - webnet

networks:
  webnet:
    driver: bridge

volumes:
  mariadb_data:
    driver: local